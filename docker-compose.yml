version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: schedly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedly
      POSTGRES_PASSWORD: schedly
      POSTGRES_DB: schedly
    ports:
      - "5432:5432"
    volumes:
      - schedly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: schedly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schedly-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  schedly_postgres_data:
